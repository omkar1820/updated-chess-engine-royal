server {
    listen 80;
    server_name _;

    root /var/www/chess;
    index chess.html;

    # Main chess app
    location / {
        try_files $uri $uri/ /chess.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Powered-By "ChessEngine-Royal";
    }

    # Static asset caching
    location ~* \.(html|css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check endpoint (used by Docker HEALTHCHECK & ALB)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
