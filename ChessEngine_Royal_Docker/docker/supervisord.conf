[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=10

[program:chess-server]
command=java -cp /app/out chess.network.ChessServer
autostart=%(ENV_START_JAVA_SERVER)s
autorestart=true
stdout_logfile=/var/log/chess-server.log
stderr_logfile=/var/log/chess-server.log
priority=20
environment=JAVA_OPTS="-Xmx256m -Xms64m"
